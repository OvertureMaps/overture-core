# Test Python Packages
#
# Auto-discovers testable packages: any directory under packages/ with both a
# pyproject.toml and a tests/ directory is tested via `uv run pytest -v`, then
# built and validated with `twine check --strict` so bad PyPI metadata fails
# the PR instead of a real release after merge. Adding a new package needs no
# edits here.

name: Test Python

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed package directories
        id: changed-dirs
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: packages/**
          files_ignore: packages/**/*.md
          dir_names: true
          dir_names_max_depth: 2
          json: true
          escape_json: false

      # PRs/pushes only test packages touched by the diff (from the step above);
      # workflow_dispatch tests every package in the repo. Either way, a
      # "changed directory" only counts if it's actually a package (has both
      # pyproject.toml and tests/) — filtering that requires a bit of scripting,
      # so it's done here rather than with a marketplace action.
      - name: Discover testable packages
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const isPackage = (name) =>
              fs.existsSync(path.join('packages', name, 'pyproject.toml')) &&
              fs.existsSync(path.join('packages', name, 'tests'));

            const candidates =
              context.eventName === 'workflow_dispatch'
                ? fs.readdirSync('packages', { withFileTypes: true })
                    .filter((entry) => entry.isDirectory())
                    .map((entry) => entry.name)
                : JSON.parse(process.env.CHANGED_DIRS || '[]')
                    .map((dir) => path.relative('packages', dir));

            const packages = candidates.filter(isPackage);
            core.info(`Discovered packages: ${JSON.stringify(packages)}`);
            core.setOutput('packages', JSON.stringify(packages));

  test:
    name: test ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/${{ matrix.package }}/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=95

      - name: Build package
        working-directory: packages/${{ matrix.package }}
        run: uv build

      # Same check publish_packages.yml runs before any real upload; running
      # it here too catches bad PyPI metadata (broken README rendering,
      # missing/invalid classifiers, license/classifier conflicts) as a PR
      # failure instead of a failed release after merge.
      - name: Check package metadata
        working-directory: packages/${{ matrix.package }}
        run: uvx twine check --strict dist/*

  # Rollup status job - required in branch protection
  rollup-python-test-status:
    name: rollup-python-test-status
    runs-on: ubuntu-latest
    permissions: {} # are-we-good only reads job results from `needs` context
    needs:
      - detect-changes
      - test
    if: always()
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
