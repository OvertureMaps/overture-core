# Publish Python Packages
#
# Runs on every push to main, but only for packages actually touched by that
# push (tj-actions/changed-files, same discovery pattern as test_python.yml).
# For each changed package (any directory under packages/), python-semantic-release
# inspects the commits since that package's last release tag — attributing
# them by which files they touched (path_filters), not by a required commit
# scope — and decides whether a release is warranted. A release creates and
# pushes a `<package_dir>-v<version>` tag and a GitHub Release — no version
# bump or changelog is ever committed back to the branch. The package's
# version is resolved from that tag at build time by setuptools-scm.
#
# Publishing to PyPI uses trusted publishing (OIDC — no stored credentials).
# See PACKAGE_VERSIONING.md for the full flow and the one-time
# trusted-publisher setup a new package needs.

name: Publish Python Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release/publish mid-flight

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed package directories
        id: changed-dirs
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: packages/**
          files_ignore: packages/**/*.md
          dir_names: true
          dir_names_max_depth: 2
          json: true
          escape_json: false

      # A push considers every package touched by the diff (from the step
      # above); workflow_dispatch considers every package in the repo (PSR
      # then still decides per-package whether a release is warranted).
      # Either way, a "changed directory" only counts if it's actually a
      # package (has both pyproject.toml and tests/) — filtering that
      # requires a bit of scripting, so it's done here rather than with a
      # marketplace action.
      - name: Discover publishable packages
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const isPackage = (name) =>
              fs.existsSync(path.join('packages', name, 'pyproject.toml')) &&
              fs.existsSync(path.join('packages', name, 'tests'));

            const candidates =
              context.eventName === 'workflow_dispatch'
                ? fs.readdirSync('packages', { withFileTypes: true })
                    .filter((entry) => entry.isDirectory())
                    .map((entry) => entry.name)
                : JSON.parse(process.env.CHANGED_DIRS || '[]')
                    .map((dir) => path.relative('packages', dir));

            const packages = candidates.filter(isPackage);
            core.info(`Discovered packages: ${JSON.stringify(packages)}`);
            core.setOutput('packages', JSON.stringify(packages));

  release:
    name: release ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment:
      name: pypi-${{ matrix.package }}
    permissions:
      contents: write # push the release tag
      id-token: write # PyPI trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Computes the next version from the commits since this package's last
      # release tag, attributing each commit to the package by its changed
      # files (see path_filters in the package's pyproject.toml), and, if a
      # release is warranted, tags and pushes it (no commit, no committed
      # changelog — release notes go to the GitHub Release instead). PSR
      # authenticates its own git push with github_token, independent of the
      # checkout step's (deliberately non-persisted) credentials.
      - name: Release ${{ matrix.package }}
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          directory: packages/${{ matrix.package }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit: false
          tag: true
          push: true
          changelog: false
          vcs_release: true
          build: false

      - name: Install uv
        if: steps.release.outputs.released == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # this job publishes a runtime artifact; don't risk a poisoned cache

      - name: Build package
        if: steps.release.outputs.released == 'true'
        working-directory: packages/${{ matrix.package }}
        run: uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/${{ matrix.package }}/dist
