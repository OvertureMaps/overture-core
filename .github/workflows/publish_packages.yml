# Publish Python Packages
#
# Runs on every push to main. python-semantic-release inspects each package's
# conventional commits (scoped to that package by commit_parser_options in its
# pyproject.toml) and decides whether it needs a release. A release creates
# and pushes a `<package_dir>-v<version>` tag and a GitHub Release — no version
# bump or changelog is ever committed back to the branch. The package's
# version is resolved from that tag at build time by setuptools-scm.
#
# Publishing to PyPI uses trusted publishing (OIDC — no stored credentials).
# See PACKAGE_VERSIONING.md for the full flow and the one-time
# trusted-publisher setup a new package needs.

name: Publish Python Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover publishable packages
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const isPackage = (dir) =>
              fs.existsSync(path.join(dir, 'pyproject.toml')) &&
              fs.existsSync(path.join(dir, 'tests'));

            const packages = fs
              .readdirSync('.', { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && !entry.name.startsWith('.'))
              .map((entry) => entry.name)
              .filter(isPackage);

            core.info(`Discovered packages: ${JSON.stringify(packages)}`);
            core.setOutput('packages', JSON.stringify(packages));

  release:
    name: release ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment:
      name: pypi-${{ matrix.package }}
    permissions:
      contents: write # push the release tag
      id-token: write # PyPI trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Computes the next version from conventional commits scoped to this
      # package and, if one is warranted, tags and pushes it (no commit, no
      # committed changelog — release notes go to the GitHub Release instead).
      - name: Release ${{ matrix.package }}
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          directory: ${{ matrix.package }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit: false
          tag: true
          push: true
          changelog: false
          vcs_release: true
          build: false

      - name: Install uv
        if: steps.release.outputs.released == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build package
        if: steps.release.outputs.released == 'true'
        working-directory: ${{ matrix.package }}
        run: uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ matrix.package }}/dist
