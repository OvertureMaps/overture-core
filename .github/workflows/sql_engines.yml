# SQL Engines
#
# Validates the generated Spark/Trino SQL in overture_core.uuids_sql against
# real engines, not just DuckDB's ANSI-SQL stand-in (see test_uuids_sql.py).
# A JVM and a Trino service container are both too heavy to run on every PR
# to the repo, so this workflow only triggers when uuids_sql.py or its tests
# change, and each engine runs as its own job with `pytest -m <engine>`
# against `test_uuids_sql_engines.py`.

name: SQL Engines

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/overture_core/overture_core/uuids_sql.py
      - packages/overture_core/tests/test_uuids_sql*.py
      - packages/overture_core/pyproject.toml
      - .github/workflows/sql_engines.yml
  push:
    branches:
      - main
    paths:
      - packages/overture_core/overture_core/uuids_sql.py
      - packages/overture_core/tests/test_uuids_sql*.py
      - packages/overture_core/pyproject.toml
      - .github/workflows/sql_engines.yml
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spark:
    name: spark
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/overture_core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/overture_core
        run: uv sync --extra dev --extra sql-spark

      - name: Run Spark engine tests
        working-directory: packages/overture_core
        run: uv run pytest -v -m spark tests/test_uuids_sql_engines.py

  trino:
    name: trino
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    services:
      trino:
        image: trinodb/trino:483
        ports:
          - 8080:8080
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/overture_core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/overture_core
        run: uv sync --extra dev --extra sql-trino

      - name: Wait for Trino to accept queries
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/info | grep -q 200; then
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not become ready in time" >&2
          exit 1

      - name: Run Trino engine tests
        working-directory: packages/overture_core
        run: uv run pytest -v -m trino tests/test_uuids_sql_engines.py

  # Rollup status job - required in branch protection
  rollup-sql-engines-status:
    name: rollup-sql-engines-status
    runs-on: ubuntu-latest
    permissions: {} # are-we-good only reads job results from `needs` context
    needs:
      - spark
      - trino
    if: always()
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
