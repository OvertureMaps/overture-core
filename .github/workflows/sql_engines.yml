# SQL Engines
#
# Runs the test suites that need a real JVM/Sedona or a Trino service
# container instead of a lightweight stand-in:
# - overture_core.uuids_sql's generated Spark/Trino SQL, validated against
#   real engines, not just DuckDB's ANSI-SQL stand-in (see test_uuids_sql.py).
# - overture_spark's `spark`-marked tests (packages/overture_spark/tests),
#   which exercise a real Spark/Sedona session via the `sql-spark` extra.
#
# Both are too heavy to run on every PR to the repo, so this workflow only
# triggers when either package's source/tests change, and detect-changes
# further narrows which jobs actually run: a PR touching only one package
# doesn't pay for the other package's JVM/Trino cost, even though both live
# under this one workflow file.

name: SQL Engines

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/overture_core/overture_core/uuids_sql.py
      - packages/overture_core/tests/test_uuids_sql*.py
      - packages/overture_core/pyproject.toml
      - packages/overture_spark/**
      - .github/workflows/sql_engines.yml
  push:
    branches:
      - main
    paths:
      - packages/overture_core/overture_core/uuids_sql.py
      - packages/overture_core/tests/test_uuids_sql*.py
      - packages/overture_core/pyproject.toml
      - packages/overture_spark/**
      - .github/workflows/sql_engines.yml
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    if: github.event_name != 'workflow_dispatch'
    outputs:
      overture_core: ${{ steps.changed.outputs.overture_core_any_changed }}
      overture_spark: ${{ steps.changed.outputs.overture_spark_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A workflow-file-only change marks both categories changed (each list
      # below repeats it), same as this workflow's own trigger paths already
      # treat it: editing this file could affect either job.
      - name: Find which package(s) changed
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            overture_core:
              - packages/overture_core/overture_core/uuids_sql.py
              - packages/overture_core/tests/test_uuids_sql*.py
              - packages/overture_core/pyproject.toml
              - .github/workflows/sql_engines.yml
            overture_spark:
              - packages/overture_spark/**
              - .github/workflows/sql_engines.yml

  spark:
    name: spark (overture_core)
    needs: detect-changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.overture_core == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/overture_core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/overture_core
        run: uv sync --extra dev --extra sql-spark

      - name: Run Spark engine tests
        working-directory: packages/overture_core
        run: uv run pytest -v -m spark tests/test_uuids_sql_engines.py

  trino:
    name: trino
    needs: detect-changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.overture_core == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    services:
      trino:
        image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534 # v483
        ports:
          - 8080:8080
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/overture_core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/overture_core
        run: uv sync --extra dev --extra sql-trino

      - name: Wait for Trino to accept queries
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/info | grep -q 200; then
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not become ready in time" >&2
          exit 1

      - name: Run Trino engine tests
        working-directory: packages/overture_core
        run: uv run pytest -v -m trino tests/test_uuids_sql_engines.py

  spark-overture-spark:
    name: spark (overture_spark)
    needs: detect-changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.overture_spark == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/overture_spark/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: packages/overture_spark
        run: uv sync --extra dev --extra sql-spark

      # Every remaining test in this package already needs Spark (see
      # test_python.yml's carve-out), so this runs the full suite with the
      # coverage floor, unlike overture_core's `-m spark` slice above.
      # test_python.yml already builds and twine-checks this package on
      # every PR, so this job only needs to cover what it can't: the tests
      # gated behind a real Spark session.
      - name: Run tests
        working-directory: packages/overture_spark
        run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=95

  # Rollup status job - required in branch protection
  rollup-sql-engines-status:
    name: rollup-sql-engines-status
    runs-on: ubuntu-latest
    permissions: {} # are-we-good only reads job results from `needs` context
    needs:
      - detect-changes
      - spark
      - trino
      - spark-overture-spark
    if: always()
    steps:
      - uses: lowlydba/are-we-good@0f90ea9fa5e47188fcb69d9306fb8b3abb656018 # v1.2.0
        with:
          jobs: ${{ toJSON(needs) }}
