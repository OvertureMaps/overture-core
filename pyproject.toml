[project]
name = "overture-core-monorepo"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/overture_cairn",
]

[dependency-groups]
dev = ["ruff==0.16.4"]  # pre-commit and CI (ruff-action version-file) both read this; keep required-version below in sync

[tool.ruff]
required-version = "0.16.4" # Ensures local executions of ruff use a consistent version/installation

[tool.ruff.format]
# ruff format is Black-compatible by default.

[tool.ruff.lint]
ignore = ["E501"]  # line length enforced by ruff format
select = [
   "F401", # unused imports
   "F403", # star imports (`from x import *`)
   "F821", # undefined names (missing imports / typos)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E402", "E712", "F811", "F405", "F403"]
"**/conftest.py" = ["F401"]  # pytest discovers fixtures via import side effects
