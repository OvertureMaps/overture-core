[project]
name = "overture-core"
dynamic = ["version"]
description = "Shared Overture business logic — portable, framework-agnostic job classes."
authors = [
    {name = "Overture Maps Foundation"}
]
license = "MIT"
# Vendored copy of the repo-root LICENSE: setuptools copies license-files
# sdist entries to the exact relative path given, so "../../LICENSE" landed
# outside the sdist root and PyPI rejected the upload. A package-local path
# is the only one that survives packaging.
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["overture", "overturemaps", "stac", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # >=0.1.0 is unsatisfiable until overture-serverless gets its own real
    # release: today's first e2e release published overture-serverless as
    # 0.0.0, so this floor breaks pip install overture-core outright. Lower
    # it as a stopgap; raise it back once overture-serverless has a real fix
    # or feat commit against it.
    "overture-serverless>=0.0.0",
    "pystac>=1.8.4",
    "boto3>=1.35",
]

[project.urls]
Homepage = "https://github.com/OvertureMaps/overture-core"
Source = "https://github.com/OvertureMaps/overture-core/tree/main/packages/overture_core"
Issues = "https://github.com/OvertureMaps/overture-core/issues"

[project.optional-dependencies]
# overture-stac pulls in stac-geoparquet>=0.7.0, which floors pyarrow>=16.
# Keeping it out of the base dependencies lets consumers who only need the
# cloud/iceberg/versioning/aws/s3 modules stay on older pyarrow pins (e.g.
# pyarrow==14.0.2 for Airflow 2.11 compat).
stac = [
    "overture-stac",
]
# Kept out of `dev`: these need a real JVM (pyspark) or a running Trino
# coordinator (trino), so only the "sql-engines" CI workflow installs them,
# not a routine local `pytest` run.
sql-spark = [
    "pyspark>=3.5",
]
sql-trino = [
    "trino>=0.328",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "overture-core[stac]",
    # Stand-in ANSI-SQL engine for the uuids_sql Spark-dialect parity tests:
    # its md5()/sha1() return lowercase hex strings directly, like Spark's,
    # so it validates the generated SQL without needing a JVM.
    "duckdb>=1.0.0",
]

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overture_core*"]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^overture_core-v(?P<version>.*)$"
git_describe_command = "git describe --dirty --tags --long --match 'overture_core-v*'"
# PyPI (and Test PyPI) rejects local version identifiers (the "+g<hash>"
# suffix setuptools_scm appends between tags), so drop it. Only affects
# unreleased/dirty builds (e.g. the workflow_dispatch smoke test) — a real
# release always builds from a clean tag.
local_scheme = "no-local-version"

[tool.uv.sources]
overture-serverless = { path = "../overture_serverless" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: requires a real Spark session (overture-core[sql-spark]); run via the sql-engines CI workflow, not routine local pytest.",
    "trino: requires a running Trino coordinator (overture-core[sql-trino]); run via the sql-engines CI workflow, not routine local pytest.",
]

[tool.coverage.run]
source = ["overture_core"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "overture_core-v{version}"
allow_zero_version = true

# path_filters (relative to this directory, since the release workflow cds
# here) is what attributes a commit to this package: PSR checks the commit's
# actual changed files, not its scope. No scope_prefix is set, so a plain
# `fix: ...`/`feat: ...` with no scope works, as long as the commit touches
# files under packages/overture_core/.
[tool.semantic_release.commit_parser_options]
path_filters = ["."]
# Without this, a conventional type outside minor_tags/patch_tags (docs,
# style, refactor, chore, build, ci, test) is parsed but contributes no
# bump, so a package can go multiple merges with no_release even though it
# changed. Floor every recognized type at a patch bump so any release-worthy
# push to this package always produces a new version.
# PSR 10.6.1's pydantic schema wants LevelBump's raw IntEnum value here, not
# the string name (a bare "patch" fails validation) -- 2 == LevelBump.PATCH.
default_bump_level = 2
