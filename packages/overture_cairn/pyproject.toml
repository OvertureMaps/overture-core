[project]
name = "overture-cairn"
dynamic = ["version"]
description = "A record of what a data pipeline does to its data, at the row and column level."
authors = [
    {name = "Overture Maps Foundation"}
]
license = "MIT"
# Vendored copy of the repo-root LICENSE: setuptools copies license-files sdist
# entries to the exact relative path given, so "../../LICENSE" lands outside the
# sdist root and PyPI rejects the upload.
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["overture", "overturemaps", "lineage", "provenance", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
# The core is pure Python by design: it holds no per-record data and never
# imports a compute engine, so an adapter can be written against any of them.
dependencies = []

[project.urls]
Homepage = "https://github.com/OvertureMaps/overture-core"
Source = "https://github.com/OvertureMaps/overture-core/tree/main/packages/overture_cairn"
Issues = "https://github.com/OvertureMaps/overture-core/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overture_cairn*"]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^overture_cairn-v(?P<version>.*)$"
git_describe_command = "git describe --dirty --tags --long --match 'overture_cairn-v*'"
# PyPI rejects local version identifiers (the "+g<hash>" suffix setuptools_scm
# appends between tags), so drop it.
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["overture_cairn"]

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "overture_cairn-v{version}"
allow_zero_version = true

# path_filters (relative to this directory, since the release workflow cds
# here) is what attributes a commit to this package: PSR checks the commit's
# actual changed files, not its scope.
[tool.semantic_release.commit_parser_options]
path_filters = ["."]
